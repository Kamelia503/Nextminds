<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextMinds</title>
    <script type="module" crossorigin src="./assets/index-G9jnSHd1.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-XzlQrLCo.css">
    <style>
      img[loading="lazy"] {
        background-color: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Add lazy loading to all images
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          const images = document.querySelectorAll('img');
          images.forEach(img => {
            if (!img.getAttribute('loading')) {
              img.setAttribute('loading', 'lazy');
            }
          });
        }, 100);
      });
      
      // Intercept the email form submission and forward to Formspree without redirect
      document.addEventListener('DOMContentLoaded', function() {
        // Wait a bit for React to render
        setTimeout(function() {
          // Find the email input and form in the React component
          const emailInput = document.querySelector('input[type="email"]');
          const form = document.querySelector('form');
          
          if (form && emailInput) {
            form.addEventListener('submit', function(e) {
              e.preventDefault();
              const email = emailInput.value;
              if (email) {
                // Submit to Formspree using fetch (prevents redirect)
                fetch('https://formspree.io/f/xkobaqbg', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    email: email
                  })
                })
                .then(response => {
                  if (response.ok) {
                    // Email submitted successfully - React component will show success message
                    // Form clear and success state is handled by React
                  }
                })
                .catch(error => console.log('Submission successful', error));
              }
            });
          }
        }, 1000);
      });
    </script>
  </body>
</html>
