<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NextMinds</title>
    <script type="module" crossorigin src="./assets/index-G9jnSHd1.js"></script>
    <style>
      /* "See How It Works" button - Purple background by default, white on hover */
      button[class*="border-2"][class*="border-white"] {
        background-color: #7C3AED !important;
        color: white !important;
        border-color: #7C3AED !important;
      }
      
      /* White background with purple text on hover */
      button[class*="border-2"][class*="border-white"]:hover {
        background-color: white !important;
        color: #7C3AED !important;
        border-color: white !important;
      }
    </style>
    <link rel="stylesheet" crossorigin href="./assets/index-XzlQrLCo.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Intercept the email form submission and forward to Formspree without redirect
      document.addEventListener('DOMContentLoaded', function() {
        // Wait a bit for React to render
        setTimeout(function() {
          // Find the email input and form in the React component
          const emailInput = document.querySelector('input[type="email"]');
          const form = document.querySelector('form');
          
          if (form && emailInput) {
            form.addEventListener('submit', function(e) {
              e.preventDefault();
              const email = emailInput.value;
              if (email) {
                // Submit to Formspree using fetch (prevents redirect)
                fetch('https://formspree.io/f/xkobaqbg', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    email: email
                  })
                })
                .then(response => {
                  if (response.ok) {
                    // Email submitted successfully - React component will show success message
                    // Form clear and success state is handled by React
                  }
                })
                .catch(error => console.log('Submission successful', error));
              }
            });
          }
        }, 1000);
      });
    </script>
  </body>
</html>
